name: ripe-lab
mgmt:
  network: ripe-lab
  #ipv4-subnet: 172.90.90.0/24

topology:
  nodes:
    colector:
      kind: linux
      image: docker.io/esanchezv/kali-python3:latest 
      binds:
       - configs/dependencies.sh:/root/dependencies.sh
      exec:
       - python3 -m pip config set global.break-system-packages true
       - chmod +x /root/dependencies.sh
       - bash /root/dependencies.sh    
      
 
